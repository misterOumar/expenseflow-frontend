name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build de production
        run: npx ng build

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build de l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: expenseflow-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
